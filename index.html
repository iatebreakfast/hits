<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hits — iatebreakfast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">♬</span>
        <span class="logo-text">Hits</span>
      </div>
      <nav class="breadcrumb" id="breadcrumb"></nav>
    </div>
  </header>

  <main class="main">

    <!-- A–Z alphabet navigation -->
    <section class="alpha-section" id="alphaSection">
      <h2 class="section-label">Browse by Artist</h2>
      <nav class="alpha-nav" id="alphaNav"></nav>
    </section>

    <!-- Artist grid -->
    <section class="grid-section" id="artistSection" hidden>
      <h2 class="section-label" id="artistSectionTitle"></h2>
      <div class="card-grid" id="artistGrid"></div>
    </section>

    <!-- Album grid -->
    <section class="grid-section" id="albumSection" hidden>
      <h2 class="section-label" id="albumSectionTitle"></h2>
      <div class="card-grid" id="albumGrid"></div>
    </section>

    <!-- Track list -->
    <section class="track-section" id="trackSection" hidden>
      <h2 class="section-label" id="trackSectionTitle"></h2>
      <ul class="track-list" id="trackList"></ul>
    </section>

    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-inner">
        <h1 class="hero-headline">Your Music Library</h1>
        <p class="hero-sub">Browse your collection by artist, album, and track.<br />Pick a letter above to get started.</p>
      </div>
    </section>

  </main>

  <!-- Sticky player bar -->
  <div class="sticky-bar" id="stickyBar" hidden>
    <div class="sticky-art-wrap">
      <img class="sticky-art" id="stickyArt" src="" alt="" />
    </div>
    <div class="sticky-info">
      <div class="sticky-title" id="stickyTitle">—</div>
      <div class="sticky-artist" id="stickyArtist">Select a track</div>
    </div>
    <div class="sticky-controls">
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="ctrl-btn ctrl-btn--play" id="playPauseBtn">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
    </div>
    <div class="sticky-progress">
      <span class="time-cur" id="timeCur">0:00</span>
      <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100" step="0.1" />
      <span class="time-dur" id="timeDur">0:00</span>
    </div>
    <div class="volume-wrap">
      <span class="vol-icon">🔊</span>
      <input type="range" class="volume-bar" id="volumeBar" value="100" min="0" max="100" />
    </div>
  </div>

  <footer class="site-footer">
    <p>Hits &nbsp;·&nbsp; iatebreakfast.com</p>
  </footer>

  <script src="browser.js"></script>
</body>
</html>
